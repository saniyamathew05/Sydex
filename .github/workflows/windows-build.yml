name: Build Sydex Android APK and Windows App

on:
  push:
    branches:
      - main
      - codex/windows-build-fix
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare PDFium for printing plugin
        shell: pwsh
        run: |
          $pdfiumDir = Join-Path $env:GITHUB_WORKSPACE "local_deps/pdfium"
          $config = Join-Path $pdfiumDir "PDFiumConfig.cmake"
          if (-not (Test-Path $config)) {
            New-Item -ItemType Directory -Force -Path $pdfiumDir | Out-Null
            $archive = Join-Path $env:RUNNER_TEMP "pdfium-win-x64.tgz"
            curl.exe -L --fail --retry 8 --retry-all-errors --retry-delay 5 `
              -o $archive `
              "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/5200/pdfium-win-x64.tgz"
            tar.exe -xzf $archive -C $pdfiumDir
          }
          if (-not (Test-Path $config)) { throw "PDFiumConfig.cmake was not found after extraction." }

      - name: Analyze Dart code
        run: flutter analyze
        # Keep release artifact generation available while legacy analyzer
        # findings are cleaned up independently. The APK build remains the
        # authoritative Android compilation check in this workflow.
        continue-on-error: true

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android release APK
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          if [[ -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::Set the SUPABASE_PUBLISHABLE_KEY repository secret before building."
            exit 1
          fi
          attempt=1
          while [[ "$attempt" -le 3 ]]; do
            if flutter build apk --release "--dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Android build failed after $attempt attempts."
              exit 1
            fi
            echo "Android/Gradle build failed; retrying (attempt $((attempt + 1))/3)..."
            sleep 15
            attempt=$((attempt + 1))
          done

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Sydex-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install NuGet for Windows plugins
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: latest

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_PUBLISHABLE_KEY)) {
            throw "Set the SUPABASE_PUBLISHABLE_KEY repository secret before building."
          }
          $attempt = 1
          while ($attempt -le 3) {
            flutter build windows --release "--dart-define=SUPABASE_PUBLISHABLE_KEY=$env:SUPABASE_PUBLISHABLE_KEY"
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "Windows build failed after $attempt attempts." }
            Write-Host "PDFium/network download failed; retrying build (attempt $($attempt + 1)/3)..."
            Start-Sleep -Seconds 10
            $attempt++
          }

      - name: Bundle Microsoft Visual C++ runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "Visual Studio locator was not found on the Windows runner."
          }

          $vsInstall = & $vswhere -latest -products '*' -property installationPath
          $crtRoot = Join-Path $vsInstall "VC\Redist\MSVC"
          $crt = Get-ChildItem $crtRoot -Directory -Recurse -Filter "Microsoft.VC143.CRT" |
            Where-Object { $_.FullName -match "\\x64\\Microsoft\.VC143\.CRT$" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $crt) {
            throw "The x64 Microsoft Visual C++ runtime files were not found."
          }

          $releaseDir = "build/windows/x64/runner/Release"
          Copy-Item -Path (Join-Path $crt.FullName "*") -Destination $releaseDir -Force

      - name: Package Windows build
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $zipPath = "build/Sydex-Windows.zip"
          if (-not (Test-Path $releaseDir)) {
            throw "Windows release directory was not found: $releaseDir"
          }
          Compress-Archive -Path (Join-Path $releaseDir "*") -DestinationPath $zipPath -Force

      - name: Upload Windows build ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Sydex-Windows
          path: build/Sydex-Windows.zip
          if-no-files-found: error
